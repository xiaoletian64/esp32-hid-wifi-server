name: ios

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    name: Build PhoneBridge (unsigned ipa)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate && sed -i '' 's/objectVersion = 77/objectVersion = 63/' PhoneBridge.xcodeproj/project.pbxproj

      - name: Build (no signing)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project PhoneBridge.xcodeproj -scheme PhoneBridge             -destination "generic/platform=iOS" -configuration Release build             CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""             -derivedDataPath build > /tmp/xc.log 2>&1 || true
          grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" /tmp/xc.log | head -30 || true
          grep -n "Undefined symbols" -A 15 /tmp/xc.log | head -60 || true
          tail -5 /tmp/xc.log
          test -d build/Build/Products/Release-iphoneos/PhoneBridge.app

      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/PhoneBridge.app Payload/
          zip -qry PhoneBridge-unsigned.ipa Payload
          ls -la PhoneBridge-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-unsigned-ipa
          path: PhoneBridge-unsigned.ipa
